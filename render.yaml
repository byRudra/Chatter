# Render Blueprint: free-tier backend (Docker) + frontend (static site).
# Deploy: https://render.com/deploy?repo=https://github.com/byRudra/Chatter
#
# The two URLs below assume Render grants the service names as subdomains. If it
# appends a suffix instead, update ALLOWED_ORIGINS and VITE_API_BASE_URL to match.

services:
  - type: web
    name: chatter-byrudra-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Comma-separated Groq keys (at least 2). Entered in the dashboard, never committed.
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: groq/openai/gpt-oss-120b
      - key: ALLOWED_ORIGINS
        value: https://chatter-byrudra.onrender.com
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      # The free plan has no persistent disk, so history resets on redeploy or idle spin-down.
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: LOG_LEVEL
        value: info

  - type: web
    name: chatter-byrudra
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: https://chatter-byrudra-api.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
