name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"

  frontend:
    name: Frontend · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          cp .env.example .env
          docker compose up -d
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000/ | grep -q "<title>Chatter</title>"
          curl -fsS http://localhost:3000/config.js | grep -q "localhost:8000"
      - if: always()
        run: docker compose logs && docker compose down -v
